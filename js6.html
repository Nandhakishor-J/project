<!-- Recursive function -->
function logRecursive(nr) {
console.log("Started function:", nr);
if (nr > 0) {
logRecursive(nr - 1);
} else {
console.log("done with recursion");
}
console.log("Ended function:", nr);
}
logRecursive(3);

// factorial
       
             let fact = 1, num = 5; //initializing variables
      function calculateFactorial(number){ //function definition
        if(number == 0)
          return 1; // 0! = 1
        else
          return number * calculateFactorial(number - 1); //recursion: calling itself
      }
      document.write("The factorial of " + num + " is " + calculateFactorial(num));
//Arrow functions

//useful whenever you want to write an implementation on the spot, such as inside another function as an argument. This is because they are a shorthand notation for writing functions.
 function doingStuff(x) {
console.log(x);
}
let doingArrowStuff = x => console.log(x);
doingArrowStuff("Great!");//invoking
